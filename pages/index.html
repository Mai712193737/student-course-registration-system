<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | Student Course Registration System</title>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <main class="auth">
    <!-- Brand panel -->
    <section class="auth__brand" aria-labelledby="brand-title">
      <span class="brand-badge" id="brand-title" data-i18n="brand.name">SCRS</span>
      <h1 class="auth__tagline" data-i18n="brand.tagline">Course Registration Portal</h1>
      <ul class="auth__highlights">
        <li data-i18n="brand.point1">Browse available courses and details</li>
        <li data-i18n="brand.point2">Register or drop courses with a capacity check</li>
        <li data-i18n="brand.point3">View your weekly schedule in one place</li>
      </ul>
    </section>

    <!-- Form panel -->
    <section class="auth__panel">
      <div class="auth__form-wrap">
        <div class="auth__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-5 9 5-9 5-9-5z" />
            <path d="M7 11.5V16c0 1.2 2.2 2.5 5 2.5s5-1.3 5-2.5v-4.5" />
            <path d="M21 9v5" />
          </svg>
        </div>

        <h2 class="auth__title" data-i18n="auth.signInAs">Sign in as</h2>

        <div class="segmented" role="radiogroup" aria-label="Account type" id="role-switch">
          <button type="button" class="segmented__option" role="radio" aria-checked="true" data-role="student" data-i18n="auth.student">Student</button>
          <button type="button" class="segmented__option" role="radio" aria-checked="false" data-role="admin" data-i18n="auth.admin">Administrator</button>
        </div>

        <form class="auth__form" id="login-form" novalidate>
          <div class="field">
            <label class="field__label" for="email" data-i18n="auth.email">University email</label>
            <input class="field__input" id="email" name="email" type="email" autocomplete="username"
                   placeholder="name@university.edu.eg" data-i18n-placeholder="auth.emailPlaceholder" />
            <span class="field__error" id="email-error" role="alert"></span>
          </div>

          <div class="field">
            <label class="field__label" for="password" data-i18n="auth.password">Password</label>
            <div class="field__control">
              <input class="field__input" id="password" name="password" type="password" autocomplete="current-password" />
              <button type="button" class="field__toggle" id="password-toggle" data-i18n="auth.show">Show</button>
            </div>
            <span class="field__error" id="password-error" role="alert"></span>
          </div>

          <div class="auth__row">
            <label class="auth__remember">
              <input type="checkbox" id="remember" />
              <span data-i18n="auth.remember">Remember me</span>
            </label>
            <a class="link" href="#" id="forgot-link" data-i18n="auth.forgot">Lost access?</a>
          </div>

          <div id="form-message" role="status" aria-live="polite"></div>

          <button type="submit" class="btn btn-primary" id="submit-btn" data-i18n="auth.signIn">Sign in</button>
        </form>

        <p class="auth__note" data-i18n="auth.note">Prototype only: no real authentication or server is used.</p>
      </div>

      <div class="auth__footer">
        <div class="switch">
          <span id="theme-label" data-i18n="ui.darkMode">Dark mode</span>
          <button type="button" class="switch__track" id="theme-toggle" role="switch" aria-checked="false" aria-labelledby="theme-label"></button>
        </div>
        <button type="button" class="icon-btn" id="lang-toggle" aria-label="Change language">
          <span id="lang-toggle-label">العربية</span>
        </button>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
